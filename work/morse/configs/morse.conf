###########################
# Configuration templates #
###########################
dnsmasq_template=/morse/configs/dnsmasq.conf
hostapd_template=/morse/configs/hostapd_s1g.conf
wpa_supplicant_template=/morse/configs/wpa_supplicant_s1g.conf

####################
# Network settings #
####################
# Interface names
halow_iface=wlan0
eth_iface=eth0

# Current Mode
# Valid modes:
#   none    - Not running as an AP or STA, IP/Routing configuration is still applied
#   ap      - Running as an AP
#   sta     - Running as a STA
#   wnm-sta - Runs STA headless with no web gui to minimise communication, also disables crash detection
mode=sta

# SSID for the HaLow network
# Inline comments not supported in ssid field
ssid=Alltek

# Encryption method
#   owe     - OWE encryption (no password)
#   sae     - SAE encryption
security=sae

# Password for HaLow network. This is used when the encryption method is sae
# Inline comments not supported in password field
password=12345678

# Enable Protected Management Frames
# 0 - PMF disabled
# 1 - PMF enabled
enable_pmf=1

# Two-letter string country code used to set regulatory domain
country=US

# Example countries, operating classes and channels
#
# /morse/configs/channels.csv can be searched for permitted channels.
# eg grep 'SG,2' /morse/configs/channels.csv  | cut -d, -f3,5 
# will list all 2 MHz channels available in Singapore and the 
# corresponding global operating class.
#
# US 1 MHz ch 1
# country=US
# op_class=68
# halow_channel=1
#
# US 2 MHz ch 6
# country=US
# op_class=69
# halow_channel=6
#
# US 4 MHz ch 48
# country=US
# op_class=70
# halow_channel=48
#
# US 8 MHz ch 44
# country=US
# op_class=71
# halow_channel=44
#
# SG 2 MHz ch 10
# country=SG
# op_class=67
# halow_channel=10
#
# AU channel map
# 915 - 928 MHz
#
# BW:OPCLASS                            AU HaLow/S1G CHANNELS
#             -------------------------------------------------------------------------
# 1 : 68      |   37   |   39   |   41   |   43   |   45   |   47   |   49   |   51   |
#             |-----------------------------------------------------------------------|
# 2 : 69      |        38       |        42       |        46       |        50       |
#             |-----------------------------------------------------------------------|
# 4 : 70      |                 40                |                 48                |
#             |-----------------------------------------------------------------------|
# 8 : 71      |                                   44                                  |
#             -------------------------------------------------------------------------
#
# S1G operating class to use - global or local. Ref: IEEE 802.11 tables E-4, E-5
# The operating class in conjunction with regulatory domain
# defines the frequency and bandwidth for permitted channels.
op_class=70

# HaLow S1G channel to use, in accordance with an operating class
# and country code.
# Use 0 for automatic channel selection (ACS).
halow_channel=8

# Primary channel bandwidth
# Defaults to 2 MHz for 4MHz and 8MHz channels,
# 1 MHz otherwise. 
# Specify to override (1 = 1 MHz, 2 = 2 MHz)
# halow_primary_bandwidth=2

# Primary channel index
halow_primary_channel_index=auto

# Beacon interval in kus (1.024 ms) (default: 100; range 15..65535)
beacon_int=100

# Number of beacons between DTIMs (default: 1; range 1..255)
dtim_period=1

# If a station does not send anything in ap_max_inactivity seconds, an
# empty data frame is sent to it in order to verify whether it is
# still in range. If this frame is not ACKed, the station will be
# disassociated and then deauthenticated. This feature is used to
# clear station table of old entries when the STAs move out of the
# range. (default: 100)
ap_max_inactivity=100

#########################
# IP & Routing Settings #
#########################

# Traffic forwarding
#  none     - Don't forward traffic between interfaces
#  router   - Forward traffic from HaLow to eth
#  extender - Forward traffic from eth to HaLow
forwarding=none

# HaLow IP Method
#  0 - Static IP
#  1 - DHCP Server (runs DHCP server)
#  2 - DHCP Client
halow_ip_method=0

# Static HaLow IP
# Used if halow_ip_method is 0 or 1
halow_ip=100.10.1.111

# Static HaLow Netmask
# Used if halow_ip_method is 0 or 1
halow_netmask=255.255.255.0

# Static HaLow Gateway
# Used if halow_ip_method is 0 or 1
halow_gateway=100.10.1.1

# HaLow DHCP range start and end
# Used if halow_ip_method is 1
halow_dhcp_range_start=100
halow_dhcp_range_end=200

# Eth IP Method
#  0 - Static IP
#  1 - DHCP Server (runs DHCP server)
#  2 - DHCP Client
eth_ip_method=0

# Static Eth IP
# Used if eth_ip_method is 0 or 1
eth_ip=172.23.219.211
#eth_ip=10.3.13.211

# Static Eth Netmask
# Used if eth_ip_method is 0 or 1
eth_netmask=255.255.255.0

# Static Eth Gateway
# Used if eth_ip_method is 0 or 1
eth_gateway=172.23.219.1
#eth_gateway=10.3.13.253

# Eth DHCP range start and end
# Used if eth_ip_method is 1
eth_dhcp_range_start=20
eth_dhcp_range_end=120

# Bridge mode
# 0 - Bridge mode disabled
# 1 - Bridge mode enabled
# If bridge mode is enabled, settings for layer 3 forwarding, HaLow IP configuration, and ethernet
# IP configuration are ignored
bridge=0

# Bridge IP Method
#  0 - Static IP
#  1 - DHCP Client
bridge_ip_method=0

# Static bridge IP
# Used if bridge_ip_method is 0
bridge_ip=192.168.1.111

# Static bridge netmask
# Used if bridge_ip_method is 0
bridge_netmask=255.255.255.0

# Static bridge gateway
# Used if bridge_ip_method is 0
bridge_gateway=192.168.1.1

##################################
# Morse Driver Module parameters #
##################################

# Test Mode (disabled by default)
#   0 - Normal operation
#   1 - Test mode download only, no verification
#   2 - Test mode reset only, no download or verification
#test_mode=1

# Debug Mask
# Bitmask to control debug output
#   0x00000008 - Errors by default
#   0x00000004 - Warnings
#   0x00000002 - Info
#   0x00000001 - Debug
#   0x00000000 - Quiet/Disabled
#debug_mask=0x00000008

# Serial
# Determines which Board Configuration File (BCF) to load
#   0  - Default configuration (bcf_default.bin)
#  <N> - Loads bcf_<N>.bin
#serial=1

# Sets last octet of MAC address
#macaddr_octet=0

# Check EFuse data
# Enabled by default, uncomment/set to 0 to enable
#enable_otp_check=0

# Disable on chip hardware encryption
#no_hwcrypt=1

# Default 0xFF mask limits max mcs to 7 on tx/rx
#mcs_mask=0xFF

# Enable/Disable channel survey (enabled by default)
#enable_survey=1

# Enable/Disable Subband transmission (2 by default)
#   0 - No subband traffic (NDP CTS/ACKs only)
#   1 - No subband data traffic - management frames (e.g. beacons) can use subbands
#   2 - Subband for data and management frames
#enable_subbands=2

# Enable/Disable Powersave (enabled by default)
#   2 - POWERSAVE_MODE_FULLY_ENABLED
#   0 - POWERSAVE_MODE_DISABLED
#enable_ps=2

# Allow/Disallow rate control to use SGI (enabled by default)
#enable_sgi_rc=1

# Enable/Disable broadcasting travelling pilot support (enabled by default)
#enable_trav_pilot=1

# Enable/Disable RTS/CTS for 8MHz (disabled by default)
#enable_rts_8mhz=1

# Enable/Disable watchdog support (Default: 1)
#enable_watchdog=1

# Set watchdog interval in seconds (Default: 30)
#watchdog_interval_secs=30

# Max number of rates to try (Default: 3)
#max_rates=3

# Maximum retries per rate (Default: 1)
#max_rate_tries=1

# SPI clock speed in Hz (Default: 16100000)
#spi_clock_speed=16100000

# Maximum number of queued TX packets (Default: 22)
#max_txq_len=22

# Enable/Disable driver reset from watchdog (disabled by default)
#enable_watchdog_reset=0

# Override default maximum aggregation count (0 is disabled)
#max_aggregation_count=0

# Enable/Disable RAW (enabled by default)
#enable_raw=1

# Enable/Disable FW ARP response offloading (disabled by default)
#enable_arp_offload=0

# Set the MCS10 configuration (disabled by default)
#   0 - MCS10_MODE_DISABLED
#   1 - MCS10_MODE_FORCED (MCS10 replaces MCS0)
#   2 - MCS10_MODE_AUTO (try MCS0 then MCS10)
#mcs10_mode=0

# Enable/Disable Powersave offload (disabled by default)
#enable_dynamic_ps_offload=0

# Enable/Disable the mac80211 connection monitor (enabled by default)
#enable_mac80211_connection_monitor=1

# Enable Virtual station test mode (disabled by default)
# This value MUST be 0 for devices configured as an AP
#   0 - Disabled
#   n - Max number of virtual stations
#virtual_sta_max=0

# Enable/Disable crash detect feature (enabled by default)
#crash_detect=1

# Enable/Disable upload snapshot feature (disabled by default)
#upload_snapshot=0
