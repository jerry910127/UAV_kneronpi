ctrl_interface=/var/run/hostapd_s1g

interface=wlan0
driver=nl80211
hw_mode=a

# IEEE 802.11ah (S1G) supported.
# 0 = disabled (default)
# 1 = enabled
ieee80211ah=1

# Channel number (IEEE 802.11)
# (default: 0, i.e., not set)
# Please note that some drivers do not use this value from hostapd and the
# channel will need to be configured separately with iwconfig.
#
# For IEEE 802.11ah (S1G), the channel given is the operating channel. Which is
# specific to the regulatory domain. An operating class (op_class) also must be
# specified.
#
# If CONFIG_ACS build option is enabled, the channel can be selected
# automatically at run time by setting channel=acs_survey or channel=0, both of
# which will enable the ACS survey based algorithm.
channel=42

# Global operating class (IEEE 802.11, Annex E, Table E-4)
# This option allows hostapd to specify the operating class of the channel
# configured with the channel parameter. channel and op_class together can
# uniquely identify channels across different bands, including the 6 GHz band.
#
# For IEEE 80211.ah (S1G), the operating class must be specified.
# S1G specific operating classes (IEEE 802.11, Annex E, Table E-5) can
# also be specified, which are region-specific.
op_class=69

# Country code (ISO/IEC 3166-1). Used to set regulatory domain.
# Set as needed to indicate country in which device is operating.
# This can limit available channels and transmit power.
# These two octets are used as the first two octets of the Country String
# (dot11CountryString)
#
# For 802.11ah (S1G) the operating frequency for different country codes
# can differ. The operating class must also be specified.
# The operating bandwidths availble also vary between country codes.
#
# E.g. EU channel 36 is 863 MHz, JP channel 36 is 917MHz.
country_code=AU

# Sub-1 GHz primary channel bandwidth.
# 0 = 1 Mhz (default)
# 1 = 2 MHz
s1g_prim_chwidth=1

ssid=MorseMicro
beacon_int=100
dtim_period=1
ap_max_inactivity=65536

# SGI and Subbands
s1g_capab=[SHORT-GI-ALL]

wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
sae_password=12345678
# this here is for pmf/mfp
ieee80211w=2

# TX queue parameters (EDCF / bursting)
# Default WMM parameters (IEEE 802.11ah draft):
# These parameters are used by the access point when transmitting frames
# to the clients.
#
# Low priority / AC_BK = background
tx_queue_data3_aifs=7
tx_queue_data3_cwmin=15
tx_queue_data3_cwmax=1023
tx_queue_data3_burst=15.0

# Normal priority / AC_BE = best effort
tx_queue_data2_aifs=3
tx_queue_data2_cwmin=15
tx_queue_data2_cwmax=1023
tx_queue_data2_burst=15.0

# High priority / AC_VI = video
tx_queue_data1_aifs=2
tx_queue_data1_cwmin=7
tx_queue_data1_cwmax=15
tx_queue_data1_burst=15.0

# Highest priority / AC_VO = voice
tx_queue_data0_aifs=2
tx_queue_data0_cwmin=3
tx_queue_data0_cwmax=7
tx_queue_data0_burst=15.0

# Default WMM parameters (IEEE 802.11ah):
# These parameters are sent to WMM clients when they associate.
# The parameters will be used by WMM clients for frames transmitted to the
# access point.
#
# note - txop_limit is in units of 32microseconds
#
#wmm_enabled=1

# Low priority / AC_BK = background
wmm_ac_bk_aifs=7
wmm_ac_bk_cwmin=4
wmm_ac_bk_cwmax=10
wmm_ac_bk_txop_limit=469
wmm_ac_bk_acm=0

# Normal priority / AC_BE = best effort
wmm_ac_be_aifs=3
wmm_ac_be_cwmin=4
wmm_ac_be_cwmax=10
wmm_ac_be_txop_limit=469
wmm_ac_be_acm=0

# High priority / AC_VI = video
wmm_ac_vi_aifs=2
wmm_ac_vi_cwmin=3
wmm_ac_vi_cwmax=4
wmm_ac_vi_txop_limit=469
wmm_ac_vi_acm=0

# Highest priority / AC_VO = voice
wmm_ac_vo_aifs=2
wmm_ac_vo_cwmin=2
wmm_ac_vo_cwmax=3
wmm_ac_vo_txop_limit=469
wmm_ac_vo_acm=0

# WNM-Sleep Mode (extended sleep mode for stations)
# 0 = disabled (default)
# 1 = enabled (allow stations to use WNM-Sleep Mode)
wnm_sleep_mode=1

# SAE mechanism for PWE derivation
# 0 = hunting-and-pecking loop only (default without password identifier)
# 1 = hash-to-element only (default with password identifier)
# 2 = both hunting-and-pecking loop and hash-to-element enabled
sae_pwe=1

# RAW configuration
# Multiple RAWs can be defined with priorities from 7 (highest) to 0 (lowest).
# RAWs are ordered after the beacon from highest to lowest priority of those
# enabled.

# When defining RAWs ensure that the sum of the all of the start_time_us and
# duration_us values does not exceed the duration of the beacon interval
# (typically 102.4ms). Otherwise RAWs may be truncated or absent.

# If no RAWs are specified, AIDs are assigned from 1-2007. If a RAW is
# specified, the priority forms the upper bits of the AID giving the following
# ranges:
# 0: 1    - 255
# 1: 256  - 511
# 2: 512  - 767
# 3: 768  - 1023
# 4: 1024 - 1279
# 5: 1280 - 1535
# 6: 1536 - 1791
# 7: 1792 - 2007

# TODO: Extend support to 8192 STAs (dependent on S1G kernel support).

# For a STA to be placed in one of these priorities/ranges raw_sta_priority
# must be specified in wpa_supplicant_s1g.conf. If unspecified, STAs are assumed
# to have priority 0.
#
# priority:                 The priority of the RAW, must be specified first.
#                           (0-7, required). The highest priority is 7.
# enabled:                  Whether this RAW is enabled when hostapd starts.
#                           (0 disabled, 1 enabled).
# start_time_us:            The start time of the RAW in us (recommend 4096 for
#                           the highest priority/first enabled RAW, default).
# duration_us:              The duration of the RAW in us (26900 default).
# slots:                    The number of slots for the RAW. (1-63, default = 1)
# cross_slot:               Whether or not cross slot bleed over is allowed.
#                           (0 disable cross slot, default).
# max_beacon_spread:        If beacon spreading is enabled, the maximum number
#                           of beacons to spread a RAW's STAs over (0 - no
#                           maximum, default).
# nominal_stas_per_beacon:  The prefered number of STAs to have in the RAW for
#                           each beacon. If the number
#                           (STAs / nominal_stas_per_beacon) is larger than
#                           max_beacon_spread there will be more STAs in each
#                           beacon. (0 disable beacon spreading, default)

#raw={
#        priority=7
#        enabled=1
#        start_time_us=4096
#        duration_us=19700
#        slots=1
#        cross_slot=0
#        max_beacon_spread=3
